[tool.taskipy.tasks]
format = 'npx --yes --package prettier prettier --write "**/*.md" && ruff format . && ruff check . --fix'
report = "npx --yes @mermaid-js/mermaid-cli@latest -i assets/pipeline.mmd -o assets/pipeline.png -b transparent && pandoc technical_report.md -o technical_report.pdf --pdf-engine=xelatex"
typecheck = 'ty check web && nbqa "ty check" . --nbqa-files ".*\.ipynb"'
web = "python -m streamlit run web/app.py --server.fileWatcherType none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
