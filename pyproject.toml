[tool.taskipy.tasks]
format = "npx --yes --package prettier prettier --write '**/*.md' && .venv/bin/ruff format . && .venv/bin/ruff check . --fix"
typecheck = ".venv/bin/nbqa \"ty check\" . --nbqa-files '.*\\.ipynb'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
