[tool.taskipy.tasks]
format = "npx --yes --package prettier prettier --write '**/*.md' && .venv/bin/ruff format . && .venv/bin/ruff check . --fix"
report = "npx --yes @mermaid-js/mermaid-cli@latest -i assets/pipeline.mmd -o assets/pipeline.png -b transparent && pandoc technical_report.md -o technical_report.pdf --pdf-engine=xelatex"
typecheck = ".venv/bin/ty check web && .venv/bin/nbqa \"ty check\" . --nbqa-files '.*\\.ipynb'"
web = ".venv/bin/python -m streamlit run web/app.py --server.fileWatcherType auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
